<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contador de Caracteres</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        textarea {
            width: 600px;
            height: 200px;
            font-size: 16px;
        }
        p {
            font-size: 18px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <h2>Contador de Caracteres</h2>
    <textarea id="texto" oninput="contarCaracteres()"></textarea>
    <p>Caracteres: <span id="contador">0</span></p>

    <script>
        function contarCaracteres() {
            let texto = document.getElementById("texto").value;
            document.getElementById("contador").innerText = texto.length;
        }
    </script>
</body>
</html>
